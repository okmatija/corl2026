<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c2410c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CoRL Trip">
  <title>CoRL 2026 Trip</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div>
        <h1 id="title">CoRL 2026 Trip</h1>
        <p class="sub" id="subtitle"></p>
      </div>
      <button class="who-btn" id="whoBtn" aria-label="Choose who you are"></button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabs" aria-label="Sections">
    <a href="#plan" data-tab="plan"><span>🗺️</span>Plan</a>
    <a href="#compare" data-tab="compare"><span>⚖️</span>Compare</a>
    <a href="#ideas" data-tab="ideas"><span>✨</span>Ideas</a>
    <a href="#stays" data-tab="stays"><span>🛏️</span>Stays</a>
    <a href="#feedback" data-tab="feedback"><span>💬</span>Feedback<b id="pendingBadge" hidden></b></a>
  </nav>

  <dialog id="noteDialog">
    <form method="dialog">
      <h3 id="noteTitle">Add a note</h3>
      <textarea id="noteText" rows="4" placeholder="What do you think?"></textarea>
      <div class="row end">
        <button value="cancel" class="ghost">Cancel</button>
        <button value="ok" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="data/trip.js"></script>
  <script src="data/feedback.js"></script>
  <script src="app.js"></script>
</body>
</html>
