<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c2410c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CoRL Trip">
  <title>CoRL 2026 Trip</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script>
    // GitHub Pages lets browsers cache files for 10 min; a timestamp on our own files makes every refresh load the latest plan.
    window.ASSET_V = Date.now();
    document.write('<link rel="stylesheet" href="styles.css?v=' + window.ASSET_V + '">');
  </script>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div>
        <h1>CoRL 2026 · USA trip</h1>
        <p class="sub">CoRL 9–12 Nov · Austin</p>
      </div>
      <button class="who-btn" id="whoBtn" aria-label="Switch who you are"></button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabs" aria-label="Sections">
    <a href="#plan" data-tab="plan"><span>🗺️</span>Plan</a>
    <a href="#ideas" data-tab="ideas"><span>✨</span>Ideas</a>
    <a href="#comments" data-tab="comments"><span>💬</span>Comments</a>
    <a href="#about" data-tab="about" aria-label="Help, about this site and update history"><span>ℹ️</span>Help</a>
  </nav>

  <dialog id="dlg">
    <form method="dialog">
      <div class="dlg-head">
        <h3></h3>
      </div>
      <p class="muted small"></p>
      <textarea rows="4"></textarea>
      <input type="text" autocomplete="off" hidden>
      <div class="row end send-row" style="margin-top:10px">
        <select id="dlgModel" class="model-select" aria-label="Claude model to action this" title="Claude model to action this"></select>
        <button type="button" class="ghost" onclick="this.closest('dialog').close('cancel')">Cancel</button>
        <button value="ok" class="primary">OK</button>
      </div>
    </form>
  </dialog>

  <!-- ✨ idea card pop-up (from an idea mentioned in the plan) -->
  <dialog id="ideaDlg" class="idea-dlg">
    <div id="ideaDlgBody"></div>
    <div class="row end" style="margin-top:8px">
      <button type="button" class="ghost" onclick="this.closest('dialog').close()">Close</button>
    </div>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
    (function () {
      var v = window.ASSET_V;
      ["data/trip.js", "data/config.js", "data/runs.js", "app.js"].forEach(function (src) {
        document.write('<script src="' + src + "?v=" + v + '"><\/script>');
      });
    })();
  </script>
</body>
</html>
